<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB3 Corruptor</title>
    <style>
        #progress {
            width: 100%;
            background-color: #f3f3f3;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px 0;
        }
        #progress-bar {
            width: 0;
            height: 20px;
            background-color: #4caf50;
            border-radius: 5px;
            transition: width 0.3s;
        }
        #status {
            text-align: center;
            margin-top: 5px;
        }
        #file-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Загрузите SB3-файл для модификации</h1>
    <input type="file" id="fileInput">

    <label for="intensity">Интенсивность:</label>
    <input type="number" id="intensity" min="1" value="10">

    <button onclick="corruptSB3File()">Портить SB3</button>
    <div id="progress">
        <div id="progress-bar"></div>
    </div>
    <div id="status">Готово</div>
    <div id="file-list"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.5.0/jszip.min.js"></script>
    <script>
        function updateProgress(percentage, status) {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status');
            progressBar.style.width = percentage + '%';
            statusText.textContent = status;
        }

        function addToFileList(message) {
            const fileList = document.getElementById('file-list');
            const entry = document.createElement('div');
            entry.textContent = message;
            fileList.appendChild(entry);
        }

        async function corruptSB3File() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const intensity = parseInt(document.getElementById('intensity').value);

            if (!file) {
                alert("Выберите файл.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function (e) {
                try {
                    const arrayBuffer = e.target.result;
                    const zip = await JSZip.loadAsync(arrayBuffer);

                    if (!zip.file("project.json")) {
                        throw new Error("Файл project.json не найден в архиве.");
                    }

                    const projectJson = await zip.file("project.json").async("string");
                    let projectData = JSON.parse(projectJson);

                    updateProgress(20, "Порча блоков...");
                    corruptBlocks(projectData.targets, intensity);

                    updateProgress(50, "Порча PNG...");
                    await corruptImages(zip, intensity);

                    updateProgress(80, "Порча звуков...");
                    await corruptSounds(zip, intensity);

                    zip.file("project.json", JSON.stringify(projectData));

                    updateProgress(100, "Генерация испорченного файла...");
                    zip.generateAsync({ type: "blob" }).then(function (content) {
                        downloadFile(content, "corrupted_project.sb3");
                        updateProgress(0, "Готово");
                    }).catch(function (error) {
                        alert("Ошибка при создании SB3: " + error.message);
                    });
                } catch (error) {
                    alert("Ошибка: " + error.message);
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function corruptBlocks(targets, intensity) {
            let allBlocks = [];
            const protectedBlocks = [
                "event_whenflagclicked", "control_forever", "control_repeat", "event_whenbroadcastreceived", "control_if"
            ];

            targets.forEach(target => {
                Object.keys(target.blocks).forEach(blockId => {
                    const block = target.blocks[blockId];
                    if (!protectedBlocks.includes(block.opcode)) {
                        allBlocks.push({ target, blockId });
                    }
                });
            });

            for (let i = 0; i < intensity && allBlocks.length > 0; i++) {
                const randomIndex = Math.floor(Math.random() * allBlocks.length);
                const blockToCorrupt = allBlocks[randomIndex];
                delete blockToCorrupt.target.blocks[blockToCorrupt.blockId];
                allBlocks.splice(randomIndex, 1);
            }
        }

        async function corruptImages(zip, intensity) {
            const images = Object.keys(zip.files).filter(file => file.endsWith('.png'));
            const imagesToCorrupt = Math.min(intensity, images.length);

            for (let i = 0; i < imagesToCorrupt; i++) {
                const randomIndex = Math.floor(Math.random() * images.length);
                const imageName = images[randomIndex];
                addToFileList(`Обработка PNG: ${imageName}`);

                let imageData = await zip.file(imageName).async("uint8array");
                imageData = await distortPNG(imageData, 200, 200, intensity);

                zip.file(imageName, imageData);
                images.splice(randomIndex, 1);
            }
        }

        async function distortPNG(imageData, width, height, intensity) {
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");

            const img = new Image();
            img.src = URL.createObjectURL(new Blob([imageData], { type: "image/png" }));
            await new Promise(resolve => img.onload = resolve);
            ctx.drawImage(img, 0, 0);

            const imageDataObj = ctx.getImageData(0, 0, width, height);
            const pixels = imageDataObj.data;

            // Порча пикселей
            for (let i = 0; i < pixels.length; i += 4) {
                if (Math.random() < 0.4) {
                    pixels[i] = Math.min(pixels[i] + intensity * 10, 255); // Усиление красного
                    pixels[i + 1] = Math.max(pixels[i + 1] - intensity * 10, 0); // Уменьшение зеленого
                    pixels[i + 2] = Math.min(pixels[i + 2] + Math.random() * intensity, 255); // Случайные изменения синего
                }
            }

            ctx.putImageData(imageDataObj, 0, 0);
            return new Promise(resolve => canvas.toBlob(blob => {
                const reader = new FileReader();
                reader.onload = () => resolve(new Uint8Array(reader.result));
                reader.readAsArrayBuffer(blob);
            }, "image/png"));
        }

        async function corruptSounds(zip, intensity) {
            const sounds = Object.keys(zip.files).filter(file => file.endsWith('.mp3') || file.endsWith('.wav'));
            const soundsToCorrupt = Math.min(intensity, sounds.length);

            for (let i = 0; i < soundsToCorrupt; i++) {
                const randomIndex = Math.floor(Math.random() * sounds.length);
                const soundName = sounds[randomIndex];
                addToFileList(`Обработка звука: ${soundName}`);
                let soundData = await zip.file(soundName).async("uint8array");

                for (let j = 0; j < soundData.length; j += 100) {
                    soundData[j] = (soundData[j] + Math.floor(Math.random() * 20 - 10)) & 0xFF;
                }

                zip.file(soundName, soundData);
                sounds.splice(randomIndex, 1);
            }
        }

        function downloadFile(data, filename) {
            if (!data) {
                alert("Ошибка: данные не были сгенерированы!");
                return;
            }
            const blob = new Blob([data], { type: "application/x-scratch-project" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
